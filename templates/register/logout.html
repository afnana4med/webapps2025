{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 text-center">
    <h2>Are you sure you want to logout?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Logout</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
